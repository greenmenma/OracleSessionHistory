name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: .NET ビルド・テスト
        run: dotnet test src/OracleSessionHistory.sln
      - name: Client ビルド
        working-directory: src/OracleSessionHistory.Client
        run: |
          npm ci
          npm run build
